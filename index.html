<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            text-align: center;
        }
        
        header h1 {
            margin: 0;
        }
        
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        section {
            margin: 2rem 0;
        }
        
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 0.5rem;
        }
        
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1rem 0;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>¡Bienvenido a Mi Primera Web!</h1>
    </header>
    
    <main>
        <section>
            <h2>Acerca de</h2>
            <p>Esta es mi primera página web. Aquí puedes encontrar información sobre mí y mis proyectos.</p>
        </section>
        
        <section>
            <h2>Contenido</h2>
            <p>La página está en desarrollo. Pronto habrá más contenido.</p>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 Mi Primera Web. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
